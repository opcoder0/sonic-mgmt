name: sonic-skip-expiry

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode
        required: false
        default: 'false'
      max_issues:
        description: Maximum issues to process (0 means no limit)
        required: false
        default: '0'
      only_repo:
        description: Optional owner/repo filter
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  enforce-skip-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Run skip expiry workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DRY_FLAG=""
          ONLY_REPO_FLAG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_FLAG="--dry-run"
            fi
            if [ -n "${{ inputs.only_repo }}" ]; then
              ONLY_REPO_FLAG="--only-repo ${{ inputs.only_repo }}"
            fi
            python -m tools.skip_expiry.main --verbose ${DRY_FLAG} --max-issues "${{ inputs.max_issues }}" ${ONLY_REPO_FLAG}
          else
            python -m tools.skip_expiry.main --verbose
          fi
